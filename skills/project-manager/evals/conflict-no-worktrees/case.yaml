schema_version: "1.1"
name: conflict-no-worktrees
expected_outcome: |
  The agent finds the AGENTS.md rule against worktrees, notes that the default workflow would isolate the work in a worktree, follows the project rule instead, and records the conflict and its resolution. It works on a branch in the same checkout, writes a failing test for weekly_total first, implements it, runs the unittest suite with passing output, and commits on the branch.
context:
  scaffold_script: place-files.sh
