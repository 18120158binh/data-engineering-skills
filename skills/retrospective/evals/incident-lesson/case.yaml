schema_version: "1.1"
name: incident-lesson
expected_outcome: |
  lesson.md explains what a replication slot is, what it remembers (the position the consumer has confirmed, so Postgres keeps WAL from there), and what max_slot_wal_keep_size does, then the normal flow, before it quotes the error. It then gives the chain from the paused connector and the backfill's WAL burst to the invalidated slot, the exact error, and why the muted lag alert missed it; the recovery and the root fix, with the disk resize marked open; the result with numbers (the unplanned outage 02:31 to 05:20, 2 h 49 min, or the full 01:50 to 05:20 window when the lesson says which it measures; 0 differences, 38,214 orders, 7.6 GB peak); and a short takeaway without this project's names or hosts. The six parts come in that order.
